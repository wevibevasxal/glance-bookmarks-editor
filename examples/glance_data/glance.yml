# Starter Glance config laid out the way glance-bookmarks-editor expects.
# Copy this folder to /opt/glance_data (or wherever GE_DATA points) and adjust.
server:
  port: 8080
  # Must be <data dir>/assets: the editor saves icons to assets/icons/ and links them as /assets/icons/<file>
  assets-path: /opt/glance_data/assets

theme:
  background-color: 0 0 0
  primary-color: 24 97 58

pages:
  # Each page lives in its own file. The editor only needs pages/home.yml.
  - $include: pages/home.yml
